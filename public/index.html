<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="app-build" content="__V__">
<meta name="description" content="Vitin7 Finance — controle financeiro pessoal">
<title>Vitin7 Finance</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css?v=__V__">
<script src="/boot.js?v=__V__"></script>
</head>
<body>
<noscript><p style="padding:20px;color:#f0c7c2">Ative o JavaScript para usar o Vitin7 Finance.</p></noscript>
<div id="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
  <main>
    <header class="topbar">
      <div>
        <h1 id="title">Início</h1>
        <p id="subtitle"></p>
      </div>
      <div class="top-right"><span id="conn" class="conn"><i class="dot"></i><span>Conectando…</span></span></div>
    </header>
    <div id="alerts"></div>
    <section id="content" aria-live="polite"><div class="loading">Carregando seu painel…</div></section>
  </main>
  <nav class="bottomnav" id="bottomnav" aria-label="Menu rápido"></nav>
</div>
<dialog id="modal"><form id="modal-form" novalidate></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input id="restore-file" type="file" accept="application/json,.json" hidden>
<script src="/app.js?v=__V__" defer></script>
</body>
</html>
